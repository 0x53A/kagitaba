[package]
name = "kagitaba-cxf"
version = "0.1.0"
edition = "2024"
publish = false
description = "CXF application payloads and credential import for Kagitaba"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
credential-exchange-format = "0.4.0"
data-encoding = "2.11.1"
kagitaba-core = { path = "../.." }
keepass = { version = "0.15.0", optional = true, features = ["serialization"] }
percent-encoding = "2.3.2"
pkcs8 = { version = "0.11.0", default-features = false }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.28.0", default-features = false, features = ["std"] }
zeroize = "1.9.1"

[dev-dependencies]
futures = "0.3.34"
keepass = { version = "0.15.0", features = ["save_kdbx4", "serialization"] }
rand_chacha = "0.10.0"

[features]
keepass = ["dep:keepass"]
